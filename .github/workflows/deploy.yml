name: Deploy Shlita to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A run that never receives jobs stays "queued" forever and cannot be
  # cancelled. One shared group would pin every later run behind it.
  group: pages-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test matrix
        run: npm test

      - name: Record whether funded Solana execution ran
        run: |
          set +e
          npm run test:solana-local
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Funded local-validator settlement executed."
          elif [ "$status" -eq 2 ]; then
            echo "Funded local-validator settlement: BLOCKED. npm test did not move tokens."
          else
            exit "$status"
          fi

      - name: Build TypeScript Project & Web Application
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-ui'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
